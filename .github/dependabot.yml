version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Reads compose.yaml, so the Selenium and Mailpit image tags get update pull requests. MariaDB gets patch updates only, because it stays on the version AlmaLinux 10 ships (see compose.yaml).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: mariadb
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # Reads docker/app/Dockerfile, so the digests that pin the AlmaLinux 10 and Composer base images get update pull requests.
  - package-ecosystem: docker
    directory: /docker/app
    schedule:
      interval: weekly
