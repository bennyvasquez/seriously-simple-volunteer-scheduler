version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Reads compose.yaml, so the Selenium and MariaDB image tags get update pull requests.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
