name: axe-core update check

on:
  schedule:
    # 08:00 UTC on the first of each month.
    - cron: '0 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a full commit hash so a moved tag can't change what runs. Dependabot updates the hash and the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open an issue if there's a newer axe-core
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/axe-update-check.sh
