; PHP-FPM pool for SSVS on AlmaLinux 10. Copy this file to /etc/php-fpm.d/ssvs.conf and remove or rename the default www.conf pool, then restart php-fpm.
; Laravel reads .env itself, so this pool passes no environment variables.
[ssvs]
user = ssvs
group = ssvs

; nginx talks to the pool through this socket, and only nginx can open it.
listen = /run/php-fpm/ssvs.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

; Starts workers when a request arrives and stops them when it's quiet. A volunteer scheduler is idle most of the time.
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s

php_admin_value[expose_php] = Off
