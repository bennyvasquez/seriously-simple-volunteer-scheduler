# nginx site for SSVS on AlmaLinux 10. Copy this file to /etc/nginx/conf.d/ssvs.conf and replace ssvs.example.org with your site's name. Check it with `nginx -t`, then reload nginx.
# Security headers come from the app itself, so nginx doesn't add any.

# Requests for any name other than yours (a scanner hitting the server's address, say) get the connection closed with no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Refuses the TLS handshake for unknown names, so this block needs no certificate.
    ssl_reject_handshake on;
    return 444;
}

# Port 80 only sends visitors to HTTPS. Certbot's checks for issuing and renewing the certificate still get through.
server {
    listen 80;
    listen [::]:80;
    server_name ssvs.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ssvs.example.org;

    # Certbot fills these two lines in when it issues the certificate.
    ssl_certificate /etc/letsencrypt/live/ssvs.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssvs.example.org/privkey.pem;

    root /var/www/ssvs/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php-fpm/ssvs.sock;
    }

    # Dotfiles (.env, .git) are never served, except .well-known.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
