# nginx site for SSVS, part 2 of 2. Copy this to /etc/nginx/conf.d/ssvs.conf after ssvs-http.conf is in place and `certbot certonly` has issued the certificate. Certbot doesn't edit it.
# Replace ssvs.example.org with your site's name. Check the result with `nginx -t`, then reload nginx.
# Security headers come from the app itself, so nginx doesn't add any.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ssvs.example.org;

    # These are the paths `certbot certonly` writes for this site's name.
    ssl_certificate /etc/letsencrypt/live/ssvs.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssvs.example.org/privkey.pem;

    root /var/www/ssvs/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php-fpm/ssvs.sock;
    }

    # Dotfiles (.env, .git) are never served, except .well-known.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
