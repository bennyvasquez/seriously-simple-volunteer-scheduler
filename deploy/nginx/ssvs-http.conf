# nginx site for SSVS, part 1 of 2. Copy this to /etc/nginx/conf.d/ssvs-http.conf first, start nginx, get the certificate, and only then add ssvs.conf. Certbot doesn't edit either file.
# Replace ssvs.example.org with your site's name. Check the result with `nginx -t`, then reload nginx.

# Requests for any name other than yours (a scanner hitting the server's address, say) get the connection closed with no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Refuses the TLS handshake for unknown names, so this block needs no certificate.
    ssl_reject_handshake on;
    return 444;
}

# Port 80 only sends visitors to HTTPS. Certbot's nginx authenticator adds its own challenge location while it issues the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name ssvs.example.org;

    location / {
        return 301 https://$host$request_uri;
    }
}
